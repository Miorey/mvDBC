name: DBC

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate CSVs
        run: make check
      - name: Build DBCs
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: dbc-build
          path: build/
